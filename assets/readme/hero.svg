  <rect width="1200" height="360" rx="28" fill="#241b2f"/>
  <path d="M48 74H1152M48 302H1152" stroke="#fff7fb" stroke-opacity=".13"/>
  <rect x="58" y="58" width="176" height="30" rx="15" fill="#fb7ab7" fill-opacity=".18" stroke="#fb7ab7" stroke-opacity=".65"/>
